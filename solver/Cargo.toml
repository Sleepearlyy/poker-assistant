[package]
name = "poker-engine"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
postflop-solver = { path = "vendor/postflop-solver", default-features = false, features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 1
