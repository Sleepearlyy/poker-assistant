name: Windows build
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish installer
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r packaging/requirements.txt
      - id: version
        working-directory: app
        run: python -c "from app_info import VERSION; print('version='+VERSION)" >> $env:GITHUB_OUTPUT
      - name: Build solver
        working-directory: app/solver
        run: |
          rustup default stable-msvc
          cargo build --release --locked
          Copy-Item target/release/poker-engine.exe poker-engine.exe
      - name: Package Windows application
        run: python packaging/build.py --iscc "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: PokerAssistant-windows-x64
          path: release/*-setup.exe
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PokerAssistant-windows-x64
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ format('v{0}', needs.build.outputs.version) }}
          COMMIT: ${{ github.sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*-setup.exe --clobber
            gh release edit "$TAG" --target "$COMMIT" --draft=false
          else
            gh release create "$TAG" release/*-setup.exe --target "$COMMIT" --title "德扑助手 $TAG" --notes "Windows 10/11 x64 安装包。必须使用 Poker Fate 的「牌面·四色底色」。使用要求与注意事项见仓库说明。"
          fi
