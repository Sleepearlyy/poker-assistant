[package]
name = "poker-engine"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", rev = "9d1509fe5077d019825f833eed04b16d342dfda1", default-features = false, features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 1
